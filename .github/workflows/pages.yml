name: Publicar la demostración en GitHub Pages

# Opcional y manual. Antes de usarlo: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Publica maqueta/demo/reporte.html como página web del repositorio.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: maqueta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: maqueta/requirements.txt
      - name: Instalar Tesseract y tipografías
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core fonts-ocr-b
      - uses: actions/cache@v4
        with:
          path: maqueta/tessdata
          key: tessdata-fast-mrz-v1
      - run: bash scripts/descargar_modelos.sh
      - run: python -m pip install -r requirements.txt
      - run: python scripts/demo_expediente.py
      - name: Preparar el sitio
        run: |
          mkdir -p ../sitio
          cp demo/reporte.html ../sitio/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
