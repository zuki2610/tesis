# Reglas de prevalidación configurables (RF-08).
# Se modifican sin cambiar el código. Ninguna regla rechaza: solo ALERTA o REVISION_HUMANA.

plazos_dias:
  publico: 60        # documentos públicos (SERMIG: menos de 60 días)
  privado: 30        # documentos privados (SERMIG: menos de 30 días)
  antecedentes: 60

umbrales:
  # Confianza mínima del OCR por campo e idioma para aceptar sin revisión humana.
  # Valores iniciales; se recalibran con la muestra de calibración (sección 10.3).
  defecto: 0.80
  nombre_similitud: 0.90

idiomas_soportados: [es, fr, en]

excepciones_pais:
  # Chile, como firmante de la Declaración de Quito, aceptó documentos de viaje
  # venezolanos vencidos como documentos de identidad (Res. Ex. 2.087/2019).
  # El criterio vigente debe confirmarlo el funcionario: se deriva, no se alerta.
  VEN:
    pasaporte_vencido: revision_humana

documentos:
  pasaporte:
    via: ocr_mrz
  antecedentes_extranjero:
    via: ocr
    tipo_plazo: antecedentes
    requiere_apostilla: true
    # Decreto 177: un certificado por cada país de residencia en los últimos 5 años.
    por_cada_pais_residencia_anios: 5
  liquidacion:
    via: firma_o_ocr
    tipo_plazo: privado
  certificado_publico_cl:
    via: emisor
    tipo_plazo: publico
